<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DUNYA | شبکه اجتماعی</title>
<style>
:root{--blue:#1877f2;--bg:#f0f2f5;--ink:#182230}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}header{background:white;box-shadow:0 1px 5px #0001;position:sticky;top:0;z-index:3;padding:12px 5%;display:flex;align-items:center;justify-content:space-between}header h1{margin:0;color:var(--blue);font-size:27px}.wrap{max-width:760px;margin:24px auto;padding:0 12px}.card{background:#fff;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px #0001}.muted{color:#657080;font-size:13px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}input,textarea,button{font:inherit;border-radius:8px;padding:11px;border:1px solid #d7dce2;width:100%;margin:5px 0}textarea{min-height:90px;resize:vertical}button{background:var(--blue);color:white;border:0;cursor:pointer;font-weight:bold}button.secondary{background:#e7f0ff;color:#145dbb}button.light{background:#eef0f3;color:#333}.hidden{display:none!important}.post img,.post video{width:100%;max-height:520px;object-fit:contain;border-radius:9px;margin-top:8px;background:#111}.post-head{display:flex;justify-content:space-between}.actions{display:flex;gap:8px;margin-top:8px}.actions button{width:auto;flex:1}.auth{max-width:420px;margin:45px auto}.tabs{display:flex;gap:8px}.tabs button{flex:1}.brand{text-align:center;color:var(--blue);font-size:32px;font-weight:bold}.comment{background:#f3f5f7;padding:8px;border-radius:8px;margin:5px 0}@media(max-width:600px){.wrap{margin:12px auto}header{padding:10px 14px}}
</style>
</head>
<body>
<header><h1>DUNYA 🌍</h1><span id="who" class="muted">به دنیا وصل شو</span><button id="logout" class="light hidden" style="width:auto">خروج</button></header>
<main class="wrap">
<section id="auth" class="auth card">
<div class="brand">DUNYA</div><p class="muted" style="text-align:center">با دنیا ارتباط بگیر</p>
<div class="tabs"><button id="showLogin">ورود</button><button id="showRegister" class="secondary">ثبت‌نام</button></div>
<div id="loginBox"><input id="loginId" placeholder="ایمیل، شماره تلفن یا نام کاربری"><input id="loginPass" type="password" placeholder="رمز عبور"><button id="loginBtn">ورود به DUNYA</button></div>
<div id="registerBox" class="hidden"><input id="regName" placeholder="نام کامل"><input id="regUser" placeholder="نام کاربری انگلیسی"><input id="regEmail" placeholder="ایمیل (اختیاری)"><input id="regPhone" placeholder="شماره تلفن با کد کشور (اختیاری)"><input id="regPass" type="password" placeholder="رمز عبور (حداقل ۸ حرف)"><button id="registerBtn">ساخت حساب</button></div>
<div id="verifyBox" class="hidden"><p>کد تأیید ارسال‌شده را وارد کنید.</p><input id="otpCode" placeholder="کد ۶ رقمی"><button id="verifyBtn">تأیید حساب</button></div>
<p id="authMsg" class="muted"></p>
</section>
<section id="app" class="hidden">
<div class="card"><h3>چه چیزی در ذهن داری؟</h3><textarea id="postText" placeholder="یک پست بنویس..."></textarea><input id="postFiles" type="file" accept="image/*,video/*" multiple><button id="publish">انتشار پست</button><p class="muted">حداکثر ۴ عکس یا ویدئو؛ هر فایل تا ۵۰ مگابایت.</p></div>
<div id="feed"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);let token=localStorage.getItem("dunyaToken"),pendingTarget="";
const api=async(url,opts={})=>{opts.headers={...(opts.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};if(opts.body&&!(opts.body instanceof FormData))opts.headers["Content-Type"]="application/json";const r=await fetch("/api"+url,opts);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"خطا");return d};
function msg(t){$("authMsg").textContent=t}
function showApp(user){$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("logout").classList.remove("hidden");$("who").textContent=user.name;loadFeed()}
$("showLogin").onclick=()=>{$("loginBox").classList.remove("hidden");$("registerBox").classList.add("hidden");$("verifyBox").classList.add("hidden");msg("")};
$("showRegister").onclick=()=>{$("registerBox").classList.remove("hidden");$("loginBox").classList.add("hidden");$("verifyBox").classList.add("hidden");msg("")};
$("loginBtn").onclick=async()=>{try{let d=await api("/auth/login",{method:"POST",body:JSON.stringify({login:$("loginId").value,password:$("loginPass").value})});token=d.token;localStorage.setItem("dunyaToken",token);showApp(d.user)}catch(e){msg(e.message)}};
$("registerBtn").onclick=async()=>{try{let email=$("regEmail").value.trim(),phone=$("regPhone").value.trim();if(!email&&!phone)throw Error("ایمیل یا شماره تلفن را وارد کنید.");let d=await api("/auth/register",{method:"POST",body:JSON.stringify({name:$("regName").value,username:$("regUser").value,email,phone,password:$("regPass").value})});pendingTarget=email||phone;$("registerBox").classList.add("hidden");$("verifyBox").classList.remove("hidden");msg(d.devOtp?"کد آزمایشی: "+d.devOtp:d.message)}catch(e){msg(e.message)}};
$("verifyBtn").onclick=async()=>{try{let d=await api("/auth/verify",{method:"POST",body:JSON.stringify({target:pendingTarget,code:$("otpCode").value})});token=d.token;localStorage.setItem("dunyaToken",token);showApp(d.user)}catch(e){msg(e.message)}};
$("logout").onclick=()=>{localStorage.removeItem("dunyaToken");token=null;location.reload()};
async function loadFeed(){try{let d=await api("/posts");$("feed").innerHTML="";d.posts.forEach(renderPost)}catch(e){$("feed").textContent=e.message}}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderPost(p){let el=document.createElement("article");el.className="card post";let media=(p.media||[]).map(m=>m.type==="video"?`<video controls src="${m.url}"></video>`:`<img loading="lazy" src="${m.url}">`).join("");el.innerHTML=`<div class="post-head"><b>${esc(p.author?.name||"کاربر")} <span class="muted">@${esc(p.author?.username||"")}</span></b><span class="muted">${new Date(p.createdAt).toLocaleString("fa")}</span></div><p>${esc(p.text).replace(/\n/g,"<br>")}</p>${media}<div class="actions"><button class="secondary like">♥ پسندیدن (${p.likes.length})</button><span class="muted">${p.comments.length} نظر</span></div><div class="comments">${p.comments.map(c=>`<div class="comment"><b>${esc(c.author?.name||"کاربر")}</b> ${esc(c.text)}</div>`).join("")}</div><div class="row"><input class="commentText" placeholder="نظر بنویس..."><button class="sendComment" style="max-width:100px">ارسال</button></div>`;
el.querySelector(".like").onclick=async()=>{try{await api(`/posts/${p._id}/like`,{method:"POST"});loadFeed()}catch(e){alert(e.message)}};
el.querySelector(".sendComment").onclick=async()=>{let v=el.querySelector(".commentText").value.trim();if(!v)return;try{await api(`/posts/${p._id}/comments`,{method:"POST",body:JSON.stringify({text:v})});loadFeed()}catch(e){alert(e.message)}};
$("feed").appendChild(el)}
$("publish").onclick=async()=>{try{let media=[];const chosen=[...$("postFiles").files];if(chosen.length){let fd=new FormData();chosen.slice(0,4).forEach(f=>fd.append("files",f));let up=await api("/upload",{method:"POST",body:fd});media=up.media}await api("/posts",{method:"POST",body:JSON.stringify({text:$("postText").value,media})});$("postText").value="";$("postFiles").value="";loadFeed()}catch(e){alert(e.message)}};
(async()=>{if(token){try{let d=await api("/me");showApp(d.user)}catch{localStorage.removeItem("dunyaToken");token=null}}})();
</script>
</body></html>
